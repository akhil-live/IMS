{% extends 'base.html' %}
{% load static %}

{% block title %}Add Item Adjustment{% endblock %}

{% block content %}
<div class="container">
  <div class="page-inner">
    <div class="page-header d-print-none">
      <h4 class="fw-bold mb-3">Add Item Adjustment</h4>
      <ul class="breadcrumbs mb-3">
        <li class="nav-home">
          <a href="{% url 'dashboard' %}">
            <i class="ri-home-3-line"></i>
          </a>
        </li>
        <li class="separator">
          <i class="ri-arrow-right-s-line"></i>
        </li>
        <li class="nav-item">
          <span class="op-7">Damaged & Lost Items</span>
        </li>
        <li class="separator">
          <i class="ri-arrow-right-s-line"></i>
        </li>
        <li class="nav-item">
          <span class="op-7">Add Item Adjustment</span>
        </li>
      </ul>
    </div>
    <div class="row">
      <div class="col-md-12">
        <div class="card">
          <div class="card-body">
            <div class="row">
              <div class="col-lg-3 col-md-4 col-sm-6">
                <div class="form-group">
                  <label for="adjustmentType">Adjustment Type <i class="ri-asterisk"></i></label>
                  <select class="form-select" id="adjustmentType" name="adjustmentType" required>
                    <option value="">Select</option>
                    <option value="">Damaged</option>                                   
                    <option value="">Lost</option>                                   
                    <option value="">Expired</option>                                   
                  </select>    
                </div>
              </div>
              <div class="col-lg-3 col-md-4 col-sm-6">
                <div class="form-group">
                  <label for="office">Office <i class="ri-asterisk"></i></label>
                  <select class="form-select" id="office" name="office" required>
                    <option value="">Select</option>
                    <option value="">Jaipur</option>                                   
                    <option value="">Kota</option>                                   
                    <option value="">Udaipur</option>                                   
                  </select>    
                </div>
              </div>
              <div class="col-lg-3 col-md-4 col-sm-6">
                <div class="form-group">
                  <label for="category">Category <i class="ri-asterisk"></i></label>
                  <select class="form-select" id="category" name="category" required="">
                    <option value="">Select</option>
                    <option value="">Furniture</option>                                   
                    <option value="">Stationary</option>                                   
                  </select>    
                </div>
              </div>
              <div class="col-lg-3 col-md-4 col-sm-6">
                <div class="form-group">
                  <label for="item">Item <i class="ri-asterisk"></i></label>
                  <select class="form-select" id="item" name="item" required>
                    <option value="">Select</option>
                    <option value="">Chair (CHA123)</option>                                   
                    <option value="">Table (TAA120)</option>                                   
                  </select>    
                </div>
              </div>
              <div class="col-lg-3 col-md-4 col-sm-6">
                <div class="form-group">
                  <label for="qty">Quantity <i class="ri-asterisk"></i></label>
                  <input type="number" class="form-control" id="qty" name="qty" value="" placeholder="Enter Item Quantity" required>
                </div>           
              </div>
              <div class="col-lg-3 col-md-4 col-sm-6">
                <div class="form-group">
                  <label for="date">Date <i class="ri-asterisk"></i></label>
                  <input type="date" class="form-control" id="date" name="date" value="" required>
                </div>           
              </div>
              <div class="col-lg-3 col-md-4 col-sm-6">
                <div class="form-group">
                  <label for="remark">Remark</label>
                  <textarea id="remark" name="remark" class="form-control" rows="3" cols="20" placeholder="Enter text here.."></textarea>
                </div>
              </div>
              <div class="d-print-none">
                <p class="text-center p-3">
                  <button type="submit" class="btn btn-success btn-sm" name="submit"><strong>Submit</strong></button>
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
      
    </div>
    
  </div>
</div>

{% endblock %}
