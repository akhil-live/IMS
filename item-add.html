{% extends 'base.html' %}
{% load static %}

{% block title %}Add New Item{% endblock %}

{% block content %}
<div class="container">
  <div class="page-inner">
    <div class="page-header d-print-none">
      <h4 class="fw-bold mb-3">Add New Item</h4>
      <ul class="breadcrumbs mb-3">
        <li class="nav-home">
          <a href="{% url 'dashboard' %}">
            <i class="ri-home-3-line"></i>
          </a>
        </li>
        <li class="separator">
          <i class="ri-arrow-right-s-line"></i>
        </li>
        <li class="nav-item">
          <span class="op-7">Items</span>
        </li>
        <li class="separator">
          <i class="ri-arrow-right-s-line"></i>
        </li>
        <li class="nav-item">
          <span class="op-7">Add New Item</span>
        </li>
      </ul>
    </div>
    <div class="row">
      <div class="col-md-12">
        <div class="card">
          <div class="card-body">
            <div class="row">
              <div class="col-lg-3 col-md-4 col-sm-6">
                <div class="form-group">
                  <label for="itemName">Item Name <i class="ri-asterisk"></i></label>
                  <input type="text" class="form-control" id="itemName" name="itemName" value="" placeholder="Enter Item Name" required="">
                </div>                 
              </div>
              <div class="col-lg-3 col-md-4 col-sm-6">
                <div class="form-group">
                  <label for="itemCode">Item Code <i class="ri-asterisk"></i></label>
                  <input type="text" class="form-control" id="itemCode" name="itemCode" value="" placeholder="Enter Item Code" required="">
                </div>                 
              </div>
              <div class="col-lg-3 col-md-4 col-sm-6">
                <div class="form-group">
                  <label for="category">Category <i class="ri-asterisk"></i></label>
                  <select class="form-select" id="category" name="category" required="">
                    <option value="">Select</option>
                    <option value="">Furniture</option> 
                    <option value="">Stationary</option> 
                  </select>    
                </div>
              </div>
              <div class="col-lg-3 col-md-4 col-sm-6">
                <div class="form-group">
                  <label for="units">Units <i class="ri-asterisk"></i></label>
                  <select class="form-select" id="units" name="units" required="">
                    <option value="">Select</option>
                    <option value="">pcs</option>                                   
                    <option value="">kg</option>                                   
                    <option value="">box</option>                                   
                  </select>    
                </div>
              </div>
              <div class="col-lg-3 col-md-3">
                <div class="form-group">
                  <label for="itemImage">Upload Item Image </label>
                  <input type="file" class="form-control" id="itemImage" name="itemImage">
                  <img src="{% static 'images/items_images/chair.jpg' %}" style="height:120px; margin:auto; width:120px; border:#CCCCCC solid 1px; margin-top:10px;" id="userPhoto" alt="Item image"> 
                </div>
              </div>
              <div class="col-lg-3 col-md-4 col-sm-6">
                <div class="form-group">
                  <label for="itemType">Item Type <i class="ri-asterisk"></i></label>
                  <select class="form-select" id="itemType" name="itemType" required>
                    <option value="">Select</option>
                    <option value="">Consumable</option>                                   
                    <option value="">Asset</option>                                   
                  </select>    
                </div>
              </div>
              <div class="col-lg-3 col-md-4 col-sm-6">
                <div class="form-group">
                  <label for="openingStock">Opening Stock (Initial Quantity) <i class="ri-asterisk"></i></label>
                  <input type="number" class="form-control" id="openingStock" name="openingStock" value="" placeholder="Enter Opening Stock" required>
                </div>                 
              </div>
              <div class="col-lg-3 col-md-4 col-sm-6">
                <div class="form-group">
                  <label for="minStock">Minimum Stock Level (For Alert) <i class="ri-asterisk"></i></label>
                  <input type="number" class="form-control" id="minStock" name="minStock" value="" placeholder="Enter Minimum Stock Level Alert" required>
                </div>                 
              </div>
              <div class="d-print-none">
                <p class="text-start p-3">
                  <button type="submit" class="btn btn-success btn-sm" name="submit"><strong>Submit</strong></button>
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
      
    </div>
    
  </div>
</div>

{% endblock %}
