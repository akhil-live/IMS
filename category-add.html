{% extends 'base.html' %}
{% load static %}

{% block title %}Add New Category{% endblock %}

{% block content %}
<div class="container">
  <div class="page-inner">
    <div class="page-header d-print-none">
      <h4 class="fw-bold mb-3">Add New Category</h4>
      <ul class="breadcrumbs mb-3">
        <li class="nav-home">
          <a href="{% url 'dashboard' %}">
            <i class="ri-home-3-line"></i>
          </a>
        </li>
        <li class="separator">
          <i class="ri-arrow-right-s-line"></i>
        </li>
        <li class="nav-item">
          <span class="op-7">Categories</span>
        </li>
        <li class="separator">
          <i class="ri-arrow-right-s-line"></i>
        </li>
        <li class="nav-item">
          <span class="op-7">Add New Category</span>
        </li>
      </ul>
    </div>
    <div class="row">
      <div class="col-md-12">
        <div class="card">
          <div class="card-body">
            <div class="col-lg-4 col-md-4 col-sm-6">
              <div class="form-group">
                <label for="categoryName">Category Name <i class="ri-asterisk"></i></label>
                <input type="text" class="form-control" id="categoryName" name="categoryName" value="" placeholder="Enter Category Name" required="">
              </div>                 
            </div>
            <div class="d-print-none">
              <p class="text-start p-3">
                <button type="submit" class="btn btn-success btn-sm" name="submit"><strong>Submit</strong></button>
              </p>
            </div>
          </div>
        </div>
      </div>
      
    </div>
    
  </div>
</div>

{% endblock %}
